# nginx site config for croppedbyayerkie.com, Node backend
#
# Install: sudo cp deploy/nginx_croppedbyayerkie_node.conf /etc/nginx/sites-available/croppedbyayerkie
#          sudo ln -sf /etc/nginx/sites-available/croppedbyayerkie /etc/nginx/sites-enabled/croppedbyayerkie
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d croppedbyayerkie.com -d www.croppedbyayerkie.com
# (certbot rewrites this file to add the HTTPS server block + redirect)
#
# Two changes from the Django version:
#   * no /static/ block — that only ever served the Django admin's assets
#   * no /admin/ proxy  — the Django admin is gone, and that block used to
#     swallow hard refreshes of the React dashboard's own /admin/* routes

server {
    listen 80;
    server_name croppedbyayerkie.com www.croppedbyayerkie.com;

    client_max_body_size 10M;

    # Uploaded product images, served straight off disk.
    location /media/ {
        alias /var/www/croppedbyayerkie/backend-node/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React build (npm run build output)
    location / {
        root /var/www/croppedbyayerkie/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
