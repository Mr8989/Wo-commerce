# nginx site config for croppedbyayerkie.com
#
# Install: sudo cp deploy/nginx_croppedbyayerkie.conf /etc/nginx/sites-available/croppedbyayerkie
#          sudo ln -s /etc/nginx/sites-available/croppedbyayerkie /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d croppedbyayerkie.com -d www.croppedbyayerkie.com
# (certbot rewrites this file to add the HTTPS server block + redirect)

server {
    listen 80;
    server_name croppedbyayerkie.com www.croppedbyayerkie.com;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/croppedbyayerkie/backend/staticfiles/;
    }

    location /media/ {
        alias /var/www/croppedbyayerkie/backend/media/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React build (npm run build output)
    location / {
        root /var/www/croppedbyayerkie/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
